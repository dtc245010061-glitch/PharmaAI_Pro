<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    
    <!-- TỐI ƯU HÓA HIỆN THỊ TRÊN THIẾT BỊ DI ĐỘNG & PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#059669" /> <!-- Màu nền thanh trạng thái (Emerald 600) -->
    
    <!-- THÔNG TIN NHẬN DIỆN THƯƠNG HIỆU -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <link rel="apple-touch-icon" href="/src/assets/logo.svg" />
    <title>PharmaAI Pro | Hệ thống Quản lý Nhà thuốc GPP</title>
    
    <!-- BẢO MẬT (Content Security Policy cơ bản) -->
    <!-- Giúp ngăn chặn các cuộc tấn công XSS (Cross-Site Scripting) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    
    <!-- SEO & OPEN GRAPH (Khi chia sẻ link hệ thống qua Zalo/Facebook nội bộ) -->
    <meta name="title" content="PharmaAI Pro - Quản trị y tế thông minh" />
    <meta name="description" content="Phần mềm quản lý nhà thuốc chuẩn GPP, kiểm soát FEFO tự động và tích hợp AI Guardrails chuyên nghiệp." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PharmaAI Pro ERP" />
    <meta property="og:description" content="Hệ thống quản lý nhà thuốc chuẩn GPP." />
    
    <!-- PRECONNECT TỐI ƯU HÓA TẢI FONT (Tăng tốc độ load UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- NO-SCRIPT FALLBACK (Cảnh báo nếu máy nhân viên tắt JavaScript) -->
    <noscript>
      <style>
        .no-js-warning {
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          height: 100vh; font-family: sans-serif; background: #f8fafc; color: #334155; text-align: center;
        }
      </style>
    </noscript>
  </head>
  
  <body>
    <!-- 
      FALLBACK KHI CHƯA LOAD XONG REACT
      Cấu trúc màn hình chờ siêu nhẹ, load ngay lập tức trước khi file JS khổng lồ tải xong
    -->
    <div id="root">
      <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: #f8fafc;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
          <!-- Biểu tượng loading nhẹ (CSS thuần) -->
          <div style="width: 40px; height: 40px; border: 4px solid #d1fae5; border-top: 4px solid #059669; border-radius: 50%; animation: spin 1s linear infinite;"></div>
          <span style="font-family: system-ui, sans-serif; color: #059669; font-weight: 600;">Đang khởi động PharmaAI Pro...</span>
        </div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    
    <!-- CẢNH BÁO NẾU TRÌNH DUYỆT TẮT JAVASCRIPT -->
    <noscript>
      <div class="no-js-warning">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <h2 style="margin-top: 20px;">Hệ thống yêu cầu bật JavaScript</h2>
        <p>Vui lòng kích hoạt JavaScript trên trình duyệt để sử dụng PharmaAI Pro.</p>
      </div>
    </noscript>

    <!-- KẾT NỐI VÀO MAIN.JSX (Trái tim của hệ thống) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
